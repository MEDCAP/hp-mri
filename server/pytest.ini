[pytest]
testpaths = tests
# The app is imported as top-level `app` / `data` (gunicorn runs `run:create_app()`
# from this directory), so the server root has to be on sys.path.
pythonpath = .
addopts = -q --strict-markers
filterwarnings =
    # data.read_mrdfile_header uses datetime.utcnow(); tracked separately.
    ignore::DeprecationWarning
