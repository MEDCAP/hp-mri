name: Checkout with submodule
description: >
  Checks out the repository including server/app/external (MEDCAP/mrd-fork).
  .gitmodules uses an SSH URL, which actions/checkout's `token` input cannot
  authenticate, so a read-only deploy key on the fork repo is required. Without
  it the submodule is silently absent and the backend image build fails.

inputs:
  deploy-key:
    description: Private half of a read-only deploy key on MEDCAP/mrd-fork.
    required: true
  fetch-depth:
    description: Passed straight through to actions/checkout.
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: ${{ inputs.fetch-depth }}
        ssh-key: ${{ inputs.deploy-key }}
