# A MongoDB for the integration tests.
#
# The suite mocks the database by default, which cannot catch an insert that
# silently drops a field or a sort that returns rows in the wrong order. These
# tests run against the real thing.
#
#   docker compose -f docker-compose.test.yml up -d
#   cd server && MONGO_TEST_URI=mongodb://localhost:27017 pytest
#   docker compose -f docker-compose.test.yml down
#
# Never point MONGO_TEST_URI at Atlas. Each test creates a uniquely named
# database and drops it in teardown; aimed at a shared cluster that is a
# liability rather than a convenience.

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    # No volume on purpose: test data should not survive a restart.
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
